<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MoneyMatters — AI-powered personal finance for India. Auto-categorize transactions, track budgets, and get smart insights. Know where every rupee goes." />
    <meta name="theme-color" content="#0F172A" />
    <title>MoneyMatters — Know where every rupee goes</title>

    <!-- DNS prefetch for backend API — URL injected from VITE_STOCK_API_URL at build time -->
    <link rel="dns-prefetch" href="%VITE_STOCK_API_URL%" />
    <link rel="preconnect" href="%VITE_STOCK_API_URL%" crossorigin />

    <!-- Google Fonts: preconnect first, then load only the weights we actually use -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Reduced from 3 families × 7 weights to 2 families × 4 weights — ~40% smaller font payload -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
